name: Finalize

# Retired 2026-10-30: the AI language step was replaced by plain rules in the
# 15-minute refresh (pipeline/rules.py). Kept manual-only until removed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Merge language-step results and rebuild the page
        run: python -m pipeline.finalize
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data data
          if ! git diff --cached --quiet; then
            git commit -m "Finalize language step $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M') SGT"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
