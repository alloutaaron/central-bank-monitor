name: Refresh

# No AI. Started every 15 minutes by an outside cron-job.org job calling the
# workflow_dispatch API (see RUNBOOK.md). GitHub's own schedule is best-effort
# (it ran 4 times in 20 hours on 2026-10-30), so it is kept only as an hourly
# backup, at minute 7 to stay clear of the outside timer's runs.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also collect news headlines since this date (YYYY-MM-DD). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ -n "$BACKFILL" ]; then python -m pipeline.run --backfill "$BACKFILL"; else python -m pipeline.run; fi

      - name: Commit refreshed data (the git history is the rolling archive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data data
          if git diff --cached --quiet; then echo "No data changes."; else
            git commit -m "Refresh $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M') SGT"
            git pull --rebase origin main   # in case code was pushed while the job ran
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
